<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV 文件中转站</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --border: #2a3340;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4fc3f7; --warn: #ff8a65;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h1 small { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: 8px; }

  /* 登录 */
  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 40px; text-align: center; width: 360px; }
  .login-box h2 { font-size: 18px; margin-bottom: 8px; }
  .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px; font-size: 24px; text-align: center; letter-spacing: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
  .login-box .err { color: var(--warn); font-size: 13px; min-height: 18px; margin-top: 8px; }

  button { background: var(--accent); color: #08243a; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--warn); border: 1px solid var(--border); padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* 工具栏 */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .breadcrumb { flex-basis: 100%; font-size: 13px; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
  .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }

  /* 拖拽区 */
  #dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); margin-bottom: 16px; transition: all .15s; }
  #dropzone.active { border-color: var(--accent); color: var(--accent); background: rgba(79,195,247,.06); }

  /* 文件表 */
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; font-weight: normal; }
  tr:last-child td { border-bottom: none; }
  tr.file-row td:first-child { cursor: pointer; }
  tr.file-row:hover { background: rgba(79,195,247,.05); }
  .fname { word-break: break-all; }
  .fdir { color: var(--accent); }
  .fmeta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ops { white-space: nowrap; text-align: right; }
  .empty { text-align: center; color: var(--muted); padding: 40px !important; }

  /* 上传进度 */
  #uploadPanel { position: fixed; right: 16px; bottom: 16px; width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: none; z-index: 50; }
  #uploadPanel h3 { font-size: 13px; margin-bottom: 8px; color: var(--muted); }
  .up-item { font-size: 12px; margin-bottom: 6px; }
  .up-item .up-name { word-break: break-all; margin-bottom: 3px; }
  .up-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .up-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .up-done { color: #81c784; }
  .up-fail { color: var(--warn); }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--warn); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; display: none; z-index: 200; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>TV 文件中转站</h2>
    <p>请输入电视屏幕上显示的 6 位配对码</p>
    <input id="codeInput" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="······">
    <div class="err" id="loginErr"></div>
    <button style="width:100%;margin-top:8px" onclick="doLogin()">连 接</button>
  </div>
</div>

<div class="container" id="main" style="display:none">
  <h1>TV 文件中转站 <small id="rootInfo"></small></h1>

  <div class="toolbar">
    <div class="breadcrumb" id="breadcrumb"></div>
    <button onclick="pickFiles()">上传文件</button>
    <button onclick="pickFolder()">上传文件夹</button>
    <button class="ghost" onclick="newFolder()">新建目录</button>
    <button class="ghost" onclick="loadList()">刷新</button>
  </div>

  <div id="dropzone">将文件或文件夹拖到这里上传（上传到当前目录）</div>

  <table>
    <thead><tr><th>名称</th><th style="width:90px">大小</th><th style="width:150px">修改时间</th><th style="width:130px"></th></tr></thead>
    <tbody id="fileList"></tbody>
  </table>

  <input type="file" id="fileInput" multiple style="display:none">
  <input type="file" id="folderInput" webkitdirectory style="display:none">
</div>

<div id="uploadPanel">
  <h3 id="uploadTitle">上传中…</h3>
  <div id="uploadList"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
let currentPath = '';
let uploadQueue = [];
let uploading = false;

// ---------- 基础请求 ----------
async function api(url, opts = {}) {
  const resp = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts));
  if (resp.status === 401) { showLogin(); throw new Error('unauthorized'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('main').style.display = 'none';
  document.getElementById('codeInput').focus();
}

async function doLogin() {
  const code = document.getElementById('codeInput').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { errEl.textContent = data.error || '配对失败'; return; }
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    init();
  } catch (e) { errEl.textContent = '连接失败：' + e.message; }
}

document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ---------- 初始化 ----------
async function init() {
  try {
    const st = await api('/api/status');
    document.getElementById('rootInfo').textContent = '根目录：' + st.root;
  } catch (_) {}
  loadList();
}

// ---------- 目录浏览 ----------
async function loadList() {
  try {
    const data = await api('/api/list?path=' + encodeURIComponent(currentPath));
    renderBreadcrumb();
    renderList(data.entries);
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const parts = currentPath ? currentPath.split('/') : [];
  let html = '<a onclick="goto(\'\')">🏠 根目录</a>';
  let acc = '';
  for (const p of parts) {
    acc = acc ? acc + '/' + p : p;
    const path = acc;
    html += ' / <a onclick="goto(\'' + escAttr(path) + '\')">' + esc(p) + '</a>';
  }
  el.innerHTML = html;
}

function renderList(entries) {
  const tbody = document.getElementById('fileList');
  if (!entries.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">空目录，拖拽文件到上方虚线框即可上传</td></tr>';
    return;
  }
  tbody.innerHTML = entries.map(e => {
    const path = currentPath ? currentPath + '/' + e.name : e.name;
    const icon = e.dir ? '📁' : '📄';
    const size = e.dir ? '—' : fmtSize(e.size);
    const time = new Date(e.mtime).toLocaleString('zh-CN', { hour12: false });
    const open = e.dir
      ? 'onclick="goto(\'' + escAttr(path) + '\')"'
      : '';
    return '<tr class="file-row">' +
      '<td ' + open + ' class="fname ' + (e.dir ? 'fdir' : '') + '">' + icon + ' ' + esc(e.name) + '</td>' +
      '<td class="fmeta">' + size + '</td>' +
      '<td class="fmeta">' + time + '</td>' +
      '<td class="ops">' +
        '<button class="danger" onclick="renameItem(\'' + escAttr(path) + '\', \'' + escAttr(e.name) + '\')">重命名</button> ' +
        '<button class="danger" onclick="deleteItem(\'' + escAttr(path) + '\', \'' + escAttr(e.name) + '\')">删除</button>' +
      '</td></tr>';
  }).join('');
}

function goto(path) { currentPath = path; loadList(); }

// ---------- 目录/文件操作 ----------
async function newFolder() {
  const name = prompt('新目录名称：');
  if (!name || !name.trim()) return;
  const path = currentPath ? currentPath + '/' + name.trim() : name.trim();
  try {
    await api('/api/mkdir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
    loadList();
  } catch (e) { toast(e.message); }
}

async function renameItem(path, oldName) {
  const newName = prompt('重命名为：', oldName);
  if (!newName || newName.trim() === oldName) return;
  try {
    await api('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, newName: newName.trim() }) });
    loadList();
  } catch (e) { toast(e.message); }
}

async function deleteItem(path, name) {
  if (!confirm('确定删除「' + name + '」？此操作不可恢复。')) return;
  try {
    await api('/api/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
    loadList();
  } catch (e) { toast(e.message); }
}

// ---------- 上传 ----------
document.getElementById('fileInput').addEventListener('change', e => {
  enqueue([...e.target.files].map(f => ({ file: f, rel: f.name })));
  e.target.value = '';
});
document.getElementById('folderInput').addEventListener('change', e => {
  enqueue([...e.target.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name })));
  e.target.value = '';
});
function pickFiles() { document.getElementById('fileInput').click(); }
function pickFolder() { document.getElementById('folderInput').click(); }

// 拖拽（支持文件夹）
const dz = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('active'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('active'); }));
dz.addEventListener('drop', async e => {
  const items = e.dataTransfer.items;
  const collected = [];
  if (items && items[0] && items[0].webkitGetAsEntry) {
    const entries = [...items].map(it => it.webkitGetAsEntry()).filter(Boolean);
    for (const entry of entries) await scanEntry(entry, '', collected);
  } else {
    [...e.dataTransfer.files].forEach(f => collected.push({ file: f, rel: f.name }));
  }
  enqueue(collected);
});

async function scanEntry(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, rel: prefix + entry.name });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    // readEntries 每次最多返回 100 条，需循环读取
    let batch;
    do {
      batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      for (const child of batch) await scanEntry(child, prefix + entry.name + '/', out);
    } while (batch.length > 0);
  }
}

function enqueue(items) {
  if (!items.length) return;
  uploadQueue.push(...items);
  document.getElementById('uploadPanel').style.display = 'block';
  if (!uploading) pumpQueue();
  else renderQueue();
}

async function pumpQueue() {
  uploading = true;
  while (uploadQueue.length) {
    const item = uploadQueue[0];
    renderQueue(item);
    try {
      await uploadOne(item, document.querySelector('#uploadList .up-item:first-child .up-bar i'));
      item.state = 'done';
    } catch (e) {
      item.state = 'fail';
      item.error = e.message;
    }
    uploadQueue.shift();
    renderQueue();
  }
  uploading = false;
  document.getElementById('uploadTitle').textContent = '上传完成';
  setTimeout(() => { document.getElementById('uploadPanel').style.display = 'none'; }, 4000);
  loadList();
}

function uploadOne(item, barEl) {
  return new Promise((resolve, reject) => {
    const url = '/api/upload?dir=' + encodeURIComponent(currentPath) + '&relpath=' + encodeURIComponent(item.rel);
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.withCredentials = true;
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && barEl) barEl.style.width = Math.round(e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else {
        let msg = 'HTTP ' + xhr.status;
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(item.file);
  });
}

function renderQueue(current) {
  const list = document.getElementById('uploadList');
  const done = uploadQueue.filter(i => i.state === 'done').length;
  document.getElementById('uploadTitle').textContent = '上传中（' + done + '/' + uploadQueue.length + '）';
  list.innerHTML = uploadQueue.slice(0, 5).map(item => {
    const cls = item.state === 'done' ? 'up-done' : item.state === 'fail' ? 'up-fail' : '';
    const suffix = item.state === 'fail' ? ' ✗ ' + esc(item.error || '') : item.state === 'done' ? ' ✓' : '';
    return '<div class="up-item ' + cls + '"><div class="up-name">' + esc(item.rel) + suffix + '</div>' +
      (item.state ? '' : '<div class="up-bar"><i></i></div>') + '</div>';
  }).join('');
}

// ---------- 工具 ----------
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escAttr(s) {
  // 先转义 JS 单引号字符串上下文，再转义 HTML 属性上下文
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// 页面加载时先探测登录态
api('/api/status').then(() => {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  init();
}).catch(() => showLogin());
</script>
</body>
</html>
