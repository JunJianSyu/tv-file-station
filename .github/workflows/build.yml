name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建流程不需要 token，降低凭证暴露面
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 项目未包含 gradle wrapper，由 setup-gradle 指定 Gradle 版本构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-file-station-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

  # 打 v* tag 时自动创建 Release 并附上 APK
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: tv-file-station-debug

      # 重命名为带版本号的 APK，方便用户识别
      - name: Rename APK
        run: mv app-debug.apk tv-file-station-${GITHUB_REF_NAME}.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: tv-file-station-*.apk
          generate_release_notes: true
